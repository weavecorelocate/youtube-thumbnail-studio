[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "youtube-thumbnail-studio"
version = "0.6.3"
description = "Plugin-host desktop studio for composing, rendering, and A/B testing YouTube thumbnails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "youtube-thumbnail-studio contributors" }]
keywords = ["youtube", "thumbnail", "ytthumb", "plugin-host", "pillow", "ctr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Editors",
]

dependencies = [
  "Pillow>=10.3.0",
  "numpy>=1.26.4",
  "pydantic>=2.7.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "watchdog>=4.0.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
face = ["mediapipe>=0.10.14"]
fonts = ["fonttools>=4.53.0"]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[project.scripts]
ytthumb = "youtube_thumbnail_studio.__main__:main"

[project.entry-points."ytthumb.plugins"]
face_crop = "ytthumb_ext_facecrop.plugin:FaceCropPlugin"
text_fx = "ytthumb_ext_textfx.plugin:TextFxPlugin"
ctr_heatmap = "ytthumb_ext_ctrheatmap.plugin:CtrHeatmapPlugin"

[tool.hatch.build.targets.wheel]
packages = ["youtube_thumbnail_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true